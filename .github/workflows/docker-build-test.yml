# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# GitHub recommends pinning actions to a commit SHA.
# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.

name: Build & Test Docker images

on:
  pull_request:

# Superseding pushes make earlier runs irrelevant: only the head commit's checks
# gate a merge. Cancelling them on branches keeps a rapidly-iterated PR from
# holding runners for commits nobody will merge. main is never cancelled, so its
# builds and scans always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build_test_images:
    name: build_test_images (${{ matrix.gatekeeper }} gatekeeper, ${{ matrix.keymaster }} keymaster)
    runs-on: ubuntu-latest
    strategy:
      # Always run both legs even if one fails, so a Rust regression doesn't
      # hide a TS regression or vice versa. Apply the same treatment to the
      # keymaster implementation matrix.
      fail-fast: false
      matrix:
        gatekeeper: [rust, typescript]
        keymaster: [typescript, python]
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.2"

      - name: Pin npm 10.9.2
        run: npm install --global npm@10.9.2

      - name: Install dependencies
        run: npm ci

      - name: Prefetch native prebuilds
        run: node scripts/prefetch-prebuilds.mjs

      - name: Setup env for Testing
        working-directory: ./tests/cli-tests
        run: ./generate_test_env.sh

      - name: Run Node
        run: |
          ./start-node-ci cli ${{ matrix.gatekeeper }} ${{ matrix.keymaster }}
          docker compose ps
          sleep 30

      - name: Run cli-tests
        env:
          CLI_TEST_CLEANUP: redis
        run: npm run test:cli

      - name: Grab logs
        if: always()
        run: |
          docker compose logs --no-color keymaster cli gatekeeper redis > docker-compose-logs.txt
          cat docker-compose-logs.txt

      - name: Teardown Docker
        run: |
          ./stop-node

      - name: Upload docker logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: docker-compose-logs-${{ matrix.gatekeeper }}-${{ matrix.keymaster }}
          path: docker-compose-logs.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: E2E Artifacts (${{ matrix.gatekeeper }}, ${{ matrix.keymaster }})
          path: e2e-results.xml

  # Replays the shared request flows in tests/gatekeeper/api-parity-flows.json
  # against BOTH gatekeeper implementations and diffs the responses. The runner
  # (scripts/gatekeeper-parity.mjs) already existed but nothing invoked it, so
  # TS/Rust parity was maintained by porting discipline with no regression guard
  # — see #771. #823 is a concrete example of the divergence this catches: block
  # `time` was stringified in both ports, and the Rust one returned it as a JSON
  # string, leaving `timeISO` null in anchoring metadata.
  gatekeeper_parity:
    name: gatekeeper parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.2"

      - name: Pin npm 10.9.2
        run: npm install --global npm@10.9.2

      - name: Install dependencies
        run: npm ci

      # The parity script imports @didcid/cipher and @didcid/ipfs from their
      # built output. `npm ci` only installs — no package defines a `prepare`
      # script — so without this the script dies on ERR_MODULE_NOT_FOUND before
      # it reaches either gatekeeper.
      - name: Build workspace packages
        run: npm run build

      - name: Prefetch native prebuilds
        run: node scripts/prefetch-prebuilds.mjs

      - name: Start both gatekeepers
        env:
          GIT_COMMIT: ${{ github.sha }}
          # The backdating phase needs a chain registry both ports accept.
          ARCHON_GATEKEEPER_REGISTRIES: local,hyperswarm,BTC:signet
        run: |
          docker compose -f docker/compose/gatekeeper-parity.yml up -d --build --wait

      - name: Run parity checks
        env:
          TS_GATEKEEPER_URL: http://localhost:4224
          RUST_GATEKEEPER_URL: http://localhost:4324
          ARCHON_ADMIN_API_KEY: parity-admin-key
        run: node scripts/gatekeeper-parity.mjs

      - name: Grab logs
        if: always()
        run: |
          docker compose -f docker/compose/gatekeeper-parity.yml logs --no-color \
            > gatekeeper-parity-logs.txt
          tail -100 gatekeeper-parity-logs.txt

      - name: Teardown
        if: always()
        run: docker compose -f docker/compose/gatekeeper-parity.yml down -v

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gatekeeper-parity-logs
          path: gatekeeper-parity-logs.txt

  # Single stable status that rolls up every build_test_images matrix leg, so
  # branch protection can require one check instead of the fragile per-leg
  # matrix names. `if: always()` is required: without it this job is skipped
  # when a leg fails, and a skipped required check would stall the PR instead
  # of failing it.
